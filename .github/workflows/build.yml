name: Build Wheels (Nuitka)

on:
  workflow_dispatch:   # <-- This means the workflow runs only when you manually trigger it

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka setuptools wheel build

      - name: Compile compress.py with Nuitka
        run: |
          nuitka3 --module src/tree_compress/compress.py --output-dir=src/tree_compress
          # Remove original source
          if [ -f src/tree_compress/compress.py ]; then rm src/tree_compress/compress.py; fi
          if [ -f src\tree_compress\compress.py ]; then del src\tree_compress\compress.py; fi

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
